# yaml-language-server: $schema=https://raw.githubusercontent.com/StrayDragon/llman-sdd/main/artifacts/schema/configs/en/llmanspec-config.schema.json
schema: spec-driven
locale: en

# BDD posture: doc-only GWT with a batch acceptance runner.
# Scenarios in llmanspec/specs/** are documentation GWT mapped to the existing
# Rust tests; there are NO per-scenario framework bindings (no pytest-bdd /
# cucumber, no `bdd` cargo feature, no per-scenario tags like @skip).
# run_command below has no {feature_*} placeholders, so validate --specs and
# change close-out execute the whole Rust suite once (batch-once).

# Optional extra skills (disabled by default, uncomment to enable).
# On `llman sdd init --update` / `update-skills`, managed candidates are:
#   default workflow skills + entries listed here (extra_skills extend).
# Then `.agents/skills/llman-sdd-*` is scanned: anything not in that candidate
# set is removed first, then candidates are written/updated. Only the
# `llman-sdd-` prefix is touched (custom skills without that prefix are kept).
# Deprecated shipped skills (e.g. removed from defaults) are cleaned this way.
# extra_skills:
#   - llman-sdd-new-change
#   - llman-sdd-continue
#   - llman-sdd-ff
#   - llman-sdd-sync
#   - llman-sdd-validate

# BDD integration: project-wide batch-once runner (no per-scenario bindings).
specs:
  check_command: cargo test --quiet
# Optional knobs (unused by dapz):
#   framework: pytest-bdd
#   # Filtered runners: include {feature_*} so validate --all/--specs runs per capability.
#   # run_command: "pytest {feature_dir} -k {feature_name} -v"
#   verify_prompt: |
#     Map test failures to requirement IDs.
